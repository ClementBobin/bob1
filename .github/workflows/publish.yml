name: 🚀 Build and Release Android APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Nécessaire pour semantic-release

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache Android build
      uses: actions/cache@v3
      with:
        path: |
          ~/.android/build-cache
          app/build
        key: ${{ runner.os }}-android-${{ hashFiles('**/build.gradle*', '**/gradle.properties', '**/settings.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-android-

    - name: Cache Kotlin
      uses: actions/cache@v3
      with:
        path: |
          ~/.kotlin/cache
          ~/.konan
        key: ${{ runner.os }}-kotlin-${{ hashFiles('**/*.kt', '**/*.kts') }}
        restore-keys: |
          ${{ runner.os }}-kotlin-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.keystore

    - name: Build Release APK (signed)
      env:
        KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --build-cache

    - name: Find and verify APK
      id: find_apk
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$APK_PATH" ]; then
          APK_PATH=$(find app/build/outputs -name "*release*.apk" -type f | head -1)
        fi

        if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "✅ APK Release signé trouvé: $APK_PATH"
          ls -la "$APK_PATH"
        else
          echo "❌ APK release non trouvé"
          find app/build -name "*.apk" 2>/dev/null
          exit 1
        fi

    - name: Setup Node.js for semantic-release
      uses: actions/setup-node@v4
      with:
        node-version: "lts/*"

    - name: Install semantic-release and plugins
      run: |
        npm install --save-dev semantic-release \
          @semantic-release/changelog \
          @semantic-release/git \
          @semantic-release/github \
          conventional-changelog-conventionalcommits

    - name: Verify APK exists for release
      run: |
        if [ -f "${{ steps.find_apk.outputs.APK_PATH }}" ]; then
          echo "✅ APK prêt pour le release: ${{ steps.find_apk.outputs.APK_PATH }}"
          ls -la "${{ steps.find_apk.outputs.APK_PATH }}"
        else
          echo "❌ APK non trouvé pour le release"
          exit 1
        fi

    - name: Run semantic release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "=== Démarrage de semantic-release ==="
        npx semantic-release

    - name: Upload APK artifact (fallback)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: ${{ steps.find_apk.outputs.APK_PATH }}
        retention-days: 30