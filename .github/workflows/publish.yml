name: 🚀 Build and Release Android

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache Android build
      uses: actions/cache@v3
      with:
        path: |
          ~/.android/build-cache
          app/build
        key: ${{ runner.os }}-android-${{ hashFiles('**/build.gradle*', '**/gradle.properties', '**/settings.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-android-

    - name: Cache Kotlin
      uses: actions/cache@v3
      with:
        path: |
          ~/.kotlin/cache
          ~/.konan
        key: ${{ runner.os }}-kotlin-${{ hashFiles('**/*.kt', '**/*.kts') }}
        restore-keys: |
          ${{ runner.os }}-kotlin-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.keystore

    - name: Build Release APK + AAB (signed)
      run: |
        ./gradlew assembleRelease bundleRelease \
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }} \
          --build-cache

    - name: Find and verify APK
      id: find_apk
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$APK_PATH" ]; then
          APK_PATH=$(find app/build/outputs -name "*release*.apk" -type f | head -1)
        fi

        if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "✅ APK trouvé: $APK_PATH"
        else
          echo "❌ APK release non trouvé"
          exit 1
        fi

    - name: Find and verify AAB
      id: find_aab
      run: |
        AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
        if [ ! -f "$AAB_PATH" ]; then
          AAB_PATH=$(find app/build/outputs -name "*release*.aab" -type f | head -1)
        fi

        if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
          echo "AAB_PATH=$AAB_PATH" >> $GITHUB_OUTPUT
          echo "✅ AAB trouvé: $AAB_PATH"
        else
          echo "❌ AAB release non trouvé"
          exit 1
        fi

    - name: Setup Node.js for semantic-release
      uses: actions/setup-node@v4
      with:
        node-version: "lts/*"

    - name: Install semantic-release and plugins
      run: |
        npm install --save-dev semantic-release \
          @semantic-release/changelog \
          @semantic-release/git \
          @semantic-release/github \
          conventional-changelog-conventionalcommits

    - name: Run semantic release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npx semantic-release

    # - name: Publish AAB to Play Store
    #   uses: r0adkll/upload-google-play@v1
    #   with:
    #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    #     packageName: com.ton.package.name   # ← ton applicationId
    #     releaseFiles: ${{ steps.find_aab.outputs.AAB_PATH }}
    #     track: internal
    #     status: completed

    - name: Upload APK artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bob1
        path: ${{ steps.find_apk.outputs.APK_PATH }}
        retention-days: 30

    - name: Upload AAB artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bob1-aab
        path: ${{ steps.find_aab.outputs.AAB_PATH }}
        retention-days: 30