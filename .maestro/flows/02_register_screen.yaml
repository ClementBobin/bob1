appId: com.mirage.bob1
name: Registration screen - navigation and family choice
tags:
  - auth
---
- launchApp:
    clearState: true
    clearKeychain: true

- tapOn: "Créer un compte"
- assertVisible: "Votre famille"
- assertVisible: "Nouvelle famille"

# Switching to "I have a code" reveals the invitation code field.
- tapOn: "J'ai un code"
- assertVisible: "Code d'invitation (8 caractères)"

# Back to the login screen.
- tapOn: "Retour"
- assertVisible: "Le club, ensemble"
